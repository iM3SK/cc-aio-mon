name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    # Python 3.8 is not built for the current ubuntu-latest image, so only that
    # job runs on ubuntu-24.04; the job name (and required-check name) is kept.
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.8') && 'ubuntu-24.04' || matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: python -c "import py_compile, shared; [py_compile.compile(f, doraise=True) for f in shared.PY_FILES]"
      - name: Run tests
        run: python tests.py
    # Ubuntu: 3.8 + 3.10 – 3.14 for full compat coverage.
    # Windows + macOS: 3.12 only (older versions not reliably available on GitHub runners).
